<script>
    document.addEventListener("DOMContentLoaded", function() {
        var mapEl = document.querySelector('.folium-map');
        var mapId = mapEl.id;
        var checkMap = setInterval(function() {
            if (window[mapId] || window['map_' + mapId]) {
                clearInterval(checkMap);
                var theMap = window[mapId] || window['map_' + mapId];
                L.Control.geocoder({
                    defaultMarkGeocode: false,
                    position: 'topright',
                    placeholder: 'Search city or place...',
                    collapsed: false,
                }).on('markgeocode', function(e) {
                    var bbox = e.geocode.bbox;
                    theMap.fitBounds(bbox);
                    L.marker(e.geocode.center).addTo(theMap).bindPopup(e.geocode.name).openPopup();
                }).addTo(theMap);
            }
        }, 100);
    });
</script>

    <script>
        // Add SMI Layer to Folium map
        var smiimageBounds = [[18.656366, 73.92102], [18.657708, 73.923031]];
        var smiImage = L.imageOverlay('smi_overlay.png', smiimageBounds, {opacity: 0.6, interactive: false});
        
        // Function to add SMI layer
        function addSMILayer() {
            // Find the Folium map (variable names have random suffixes)
            var map = null;
            for (var key in window) {
                if (key.startsWith('map_') && window[key] && typeof window[key].addLayer === 'function') {
                    map = window[key];
                    break;
                }
            }
            
            if (map) {
                // Add SMI layer directly to the map
                smiImage.addTo(map);
                console.log('SMI layer added to map');
            } else {
                console.log('Map not found');
            }
        }
        
        // Wait for page to load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', addSMILayer);
        } else {
            addSMILayer();
        }
    </script>
